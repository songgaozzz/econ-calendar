<style>

  * { box-sizing: border-box; }

  header {
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
    padding:12px 18px; background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  h1 { font-size:18px; margin:0; color:#1f4e79; }
  .page-link {
    display:inline-block; background:#c0392b; color:#fff; font-weight:700;
    font-size:14px; padding:8px 16px; border-radius:8px; text-decoration:none;
    box-shadow:0 2px 6px rgba(192,57,43,.35); letter-spacing:.04em;
  }
  .page-link:hover { background:#a93226; color:#fff; }
  .nav { display:flex; align-items:center; gap:8px; }
  .nav button, .nav label, .filters button, .filters label {

  .nav button:hover { background:#eef3f8; }

  #monthSelect:focus { outline:1px solid var(--line); border-radius:4px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-left:auto; }

  #countrySelect {

  .cell.out { background:#f3f4f6; color:#aaa; }
  .cell.today { outline:2px solid #c0392b; outline-offset:-2px; }
  .cell .d { font-weight:700; font-size:13px; margin-bottom:4px; }
  .chip { display:block; width:100%; text-align:left; border:0; border-radius:4px;

    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip.US { background:var(--us); }
  .chip.CN { background:var(--cn); }
  .chip.BR { background:var(--br); }
  .chip.AR { background:var(--ar); }
  .chip.CA { background:var(--ca); }
  .chip.AU { background:var(--au); }
  .chip.EU { background:var(--eu); }
  .chip.JP { background:var(--jp); }
  .chip.GLOBAL { background:var(--gl); }
  .chip.B { opacity:.78; }
  .chip:hover { filter:brightness(1.08); }
  .modal {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .modal[hidden] { display:none !important; }
  .modal-backdrop {
    position:absolute; inset:0; background:rgba(0,0,0,.4);
  }
  .modal-card {
    position:relative; z-index:1;
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.22);
    width:calc(100% - 32px); max-width:440px;
    max-height:80vh; overflow:auto;
    padding:18px 18px 14px;
  }
  .modal-close {
    position:absolute; top:8px; right:10px;
    border:0; background:transparent; color:#666;
    font-size:22px; line-height:1; cursor:pointer;
    padding:4px 8px; border-radius:6px;
  }
  .modal-close:hover { background:#f0f2f5; color:#111; }
  .modal-body h2 { margin:0 28px 8px 0; font-size:15px; }
  .modal-body { padding:0; }
  .empty { color:var(--muted); font-size:13px; }
  .kv { font-size:13px; line-height:1.7; }
  .kv b { display:inline-block; min-width:3.2em; color:#555; font-weight:600; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; color:#fff; margin-right:4px; }
  .badge.imp-high { background:#b8860b; }
  .badge.imp-mid { background:#888; }
  .badge.imp-low { background:#bbb; }
  .unit { color:#888; font-weight:400; font-size:12px; margin-left:4px; }
  .act-ok { color:#1e8449; font-weight:600; }
  .foot { font-size:11px; color:#999; margin-top:16px; }
</style>
</head>

const AS_OF = "2026-09-20";
let view = new Date(AS_OF + "T00:00:00");

function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function countriesOn(){
  const v = document.getElementById("countrySelect").value;
  return (!v || v === "ALL") ? null : v;
}
function passCountry(ev){
  const sel = countriesOn();
  return sel === null || ev.country === sel;
}
function visible(ev){
  if (!passCountry(ev)) return false;
  if (document.getElementById("modeFin").checked && ev.type === "ag") return false;
  if (document.getElementById("modeInd").checked && ev.type !== "ag") return false;
  return true;
}
function ymKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function ymLabel(ym){ const [y,mo]=ym.split("-"); return y+"年"+Number(mo)+"月"; }
function availableMonths(){
  return [...new Set(EVENTS.map(ev => ev.date.slice(0,7)))].sort();
}
function ensureMonthOption(ym){
  const sel = document.getElementById("monthSelect");
  if ([...sel.options].some(o => o.value === ym)) return;
  const opt = document.createElement("option");
  opt.value = ym;
  opt.textContent = ymLabel(ym);
  const months = [...sel.options].map(o => o.value).concat([ym]).sort();
  sel.innerHTML = "";
  months.forEach(m => {
    const o = document.createElement("option");
    o.value = m; o.textContent = ymLabel(m); sel.appendChild(o);
  });
}
function fillMonthSelect(){
  const sel = document.getElementById("monthSelect");
  const months = availableMonths();
  const cur = ymKey(view);
  sel.innerHTML = "";
  const all = months.includes(cur) ? months : [...months, cur].sort();
  all.forEach(ym => {
    const opt = document.createElement("option");
    opt.value = ym; opt.textContent = ymLabel(ym); sel.appendChild(opt);
  });
  sel.value = cur;
}
function syncMonthSelect(){
  const cur = ymKey(view);
  ensureMonthOption(cur);
  document.getElementById("monthSelect").value = cur;
}
function render(){
  const y = view.getFullYear(), m = view.getMonth();
  syncMonthSelect();
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday=0
  const start = new Date(y, m, 1 - startOffset);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const today = AS_OF;
  for (let i=0;i<42;i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const key = ymd(d);
    const cell = document.createElement("div");
    cell.className = "cell" + (d.getMonth()===m ? "" : " out") + (key===today ? " today" : "");
    const head = document.createElement("div");
    head.className = "d";
    head.textContent = d.getDate();
    cell.appendChild(head);
    EVENTS.filter(ev => ev.date===key && visible(ev))
      .sort((a,b) => a.time.localeCompare(b.time))
      .forEach((ev, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip "+ev.country+(ev.tier==="B"?" B":"");
        b.textContent = ev.time+" "+ev.country_cn+" "+ev.title;
        b.title = ev.title;
        b.addEventListener("click", () => show(ev, key));
        cell.appendChild(b);
      });
    cell.addEventListener("click", (e) => {
      if (e.target === cell || e.target === head) showDay(key);
    });
    grid.appendChild(cell);
  }
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtVal(val, unit, opts){
  opts = opts || {};
  const raw = (val==null ? "" : String(val)).trim();
  const u = (unit==null ? "" : String(unit)).trim();
  if (!raw || raw==="——" || raw==="—") return "——";
  const skipUnit = !u || u==="——" || u==="—" || u==="报告" || u==="合约";
  const hasPctDigit = /\d.*%|%.*\d/.test(raw);
  const hasUnitStr = !skipUnit && raw.indexOf(u) !== -1;
  const statusLike = /已[公布召开发布举行交割]/.test(raw);
  const descriptive = /m\/m|y\/y|bp|万|人|蒲|吨/.test(raw);
  const mostlyNum = /^[+-]?[\d,]+(?:\.\d+)?(?:\s*[–—-]\s*[+-]?[\d,]+(?:\.\d+)?)?$/.test(raw);
  let body = esc(raw);
  if (opts.actualOk) body = '<span class="act-ok">'+body+"</span>";
  if (skipUnit || hasPctDigit || hasUnitStr || statusLike || descriptive || !mostlyNum) {
    return body;
  }
  return body + '<span class="unit">'+esc(u)+"</span>";
}
function openModal(){
  const m = document.getElementById("modal");
  m.hidden = false;
  document.body.style.overflow = "hidden";
}
function closeModal(){
  const m = document.getElementById("modal");
  m.hidden = true;
  document.body.style.overflow = "";
}
function show(ev, key){
  const prev = fmtVal(ev.previous, ev.unit);
  const fcst = fmtVal(ev.forecast, ev.unit);
  const act = ev.actual ? fmtVal(ev.actual, ev.unit, {actualOk:true}) : "待公布";
  document.getElementById("panel").innerHTML = `
    <h2 id="modalTitle">${esc(ev.title)}</h2>
    <div>
      <span class="badge" style="background:${({US:'#1f4e79',CN:'#c0392b',BR:'#1e8449',AR:'#6c3483',CA:'#e74c3c',AU:'#f39c12',EU:'#2980b9',JP:'#8e44ad',GLOBAL:'#c45c26'})[ev.country]}">${esc(ev.country_cn)}</span>
      <span class="badge ${ev.tier==="A"?"imp-high":ev.tier==="B"?"imp-mid":"imp-low"}">${ev.tier==="A"?"高":ev.tier==="B"?"中":"低"}</span>
    </div>
    <div class="kv" style="margin-top:10px">
      <div><b>日期</b>${esc(ev.date)} ${esc(ev.time)}（北京）</div>
      <div><b>机构</b>${esc(ev.agency)}</div>
      <div><b>报告期</b>${esc(ev.period || "—")}</div>
      <div><b>前值</b>${prev}</div>
      <div><b>预期</b>${fcst}</div>
      <div><b>实际</b>${act}</div>
      <div><b>来源</b>${esc(ev.source || "—")}</div>
    </div>
    <p class="foot">同一天其它事件点格子即可切换。</p>
  `;
  openModal();
}
function showDay(key){
  const list = EVENTS.filter(ev => ev.date===key && visible(ev))
    .sort((a,b)=>a.time.localeCompare(b.time));
  if (!list.length) {
    document.getElementById("panel").innerHTML = `<h2 id="modalTitle">${key}</h2><p class="empty">当天无已筛选事件。</p>`;
    openModal();
    return;
  }
  show(list[0], key);
}
function shiftMonth(delta){
  view = new Date(view.getFullYear(), view.getMonth()+delta, 1);
  render();
}
document.getElementById("prev").onclick = () => shiftMonth(-1);
document.getElementById("next").onclick = () => shiftMonth(1);
document.getElementById("todayBtn").onclick = () => { view = new Date(AS_OF+"T00:00:00"); render(); };
document.getElementById("monthSelect").addEventListener("change", (e) => {
  const [y, mo] = e.target.value.split("-").map(Number);
  view = new Date(y, mo-1, 1);
  render();
});
document.getElementById("countrySelect").addEventListener("change", render);
document.querySelectorAll(".filters input").forEach(i => i.addEventListener("change", render));
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target && e.target.getAttribute("data-close") === "1") closeModal();
});
document.querySelector(".modal-card").addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.getElementById("modal").hidden) closeModal();
});
fillMonthSelect();
render();
</script>
