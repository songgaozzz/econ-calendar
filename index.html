<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>全球财经日历</title>
<style>
  :root {
    --us:#1f4e79; --cn:#c0392b; --br:#1e8449; --ar:#6c3483; --gl:#c45c26;
    --bg:#f6f7f9; --card:#fff; --line:#e6e8ee; --ink:#1a1a1a; --muted:#667;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
  header {
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
    padding:12px 18px; background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  h1 { font-size:18px; margin:0; color:#1f4e79; }
  .page-link {
    display:inline-block; background:#c0392b; color:#fff; font-weight:700;
    font-size:14px; padding:8px 16px; border-radius:8px; text-decoration:none;
    box-shadow:0 2px 6px rgba(192,57,43,.35); letter-spacing:.04em;
  }
  .page-link:hover { background:#a93226; color:#fff; }
  .nav { display:flex; align-items:center; gap:8px; }
  .nav button, .filters button, .filters label {
    border:1px solid var(--line); background:#fff; border-radius:6px;
    padding:4px 10px; cursor:pointer; font-size:13px;
  }
  .nav button:hover { background:#eef3f8; }
  #monthLabel { min-width:120px; text-align:center; font-weight:700; font-size:16px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-left:auto; }
  .filters label { user-select:none; }
  .filters label.on-us { border-color:var(--us); color:var(--us); }
  .filters label.on-cn { border-color:var(--cn); color:var(--cn); }
  .filters label.on-br { border-color:var(--br); color:var(--br); }
  .filters label.on-ar { border-color:var(--ar); color:var(--ar); }
  .filters label.on-gl { border-color:var(--gl); color:var(--gl); }
  .filters label.dim { opacity:.4; }
  .legend { font-size:12px; color:var(--muted); }
  .wrap { display:grid; grid-template-columns: 1fr 320px; gap:12px; padding:12px 18px 24px; height:calc(100% - 62px); min-height:0; }
  @media (max-width: 960px) { .wrap { grid-template-columns:1fr; height:auto; } }
  .cal { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; min-height:0; height:100%; }
  .dow { display:grid; grid-template-columns:repeat(7,1fr); background:#1f4e79; color:#fff; font-size:12px; flex-shrink:0; }
  .dow div { padding:8px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(108px, auto); flex:1; min-height:0; overflow:auto; }
  .cell { border:1px solid var(--line); padding:6px; min-height:108px; background:#fff; }
  .cell.out { background:#f3f4f6; color:#aaa; }
  .cell.today { outline:2px solid #c0392b; outline-offset:-2px; }
  .cell .d { font-weight:700; font-size:13px; margin-bottom:4px; }
  .chip { display:block; width:100%; text-align:left; border:0; border-radius:4px;
    padding:2px 5px; margin:0 0 3px; font-size:11px; color:#fff; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip.US { background:var(--us); }
  .chip.CN { background:var(--cn); }
  .chip.BR { background:var(--br); }
  .chip.AR { background:var(--ar); }
  .chip.GLOBAL { background:var(--gl); }
  .chip.B { opacity:.78; }
  .chip:hover { filter:brightness(1.08); }
  aside { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  aside h2 { margin:0 0 8px; font-size:15px; }
  .empty { color:var(--muted); font-size:13px; }
  .kv { font-size:13px; line-height:1.7; }
  .kv b { display:inline-block; min-width:3.2em; color:#555; font-weight:600; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; color:#fff; margin-right:4px; }
  .foot { font-size:11px; color:#999; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>全球财经日历</h1>
  <a class="page-link" href="list.html">列表页</a>
  <div class="nav">
    <button type="button" id="prev">‹</button>
    <div id="monthLabel"></div>
    <button type="button" id="next">›</button>
    <button type="button" id="todayBtn">今天</button>
  </div>
  <div class="filters">
    <label class="on-us"><input type="checkbox" data-c="US" checked> 美国</label>
    <label class="on-cn"><input type="checkbox" data-c="CN" checked> 中国</label>
    <label class="on-br"><input type="checkbox" data-c="BR" checked> 巴西</label>
    <label class="on-ar"><input type="checkbox" data-c="AR" checked> 阿根廷</label>
    <label class="on-gl"><input type="checkbox" data-c="GLOBAL" checked> 中美/全球</label>
    <label><input type="checkbox" id="onlyA"> 仅 A 级</label>
    <label><input type="checkbox" id="onlyMeet"> 仅会议/大选</label>
    <label><input type="checkbox" id="onlyInd"> 产业</label>
    <span class="legend">北京时间 · 点格子看详情</span>
  </div>
</header>
<div class="wrap">
  <div class="cal">
    <div class="dow">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <aside id="panel">
    <h2>点击事件查看详情</h2>
    <p class="empty">对齐四国宏观周报栏目。报价（汇率/股指）不入库；会议/大选进 ad-hoc。</p>
    <p class="foot">时间均为北京时间。WASDE 等美盘午间发布会落在次日 00:00。</p>
  </aside>
</div>

const AS_OF = "2026-09-18";
let view = new Date(AS_OF + "T00:00:00");

function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function countriesOn(){
  return [...document.querySelectorAll(".filters input[data-c]")]
    .filter(i => i.checked).map(i => i.dataset.c);
}
function visible(ev){
  if (!countriesOn().includes(ev.country)) return false;
  if (document.getElementById("onlyA").checked && ev.tier !== "A") return false;
  if (document.getElementById("onlyMeet").checked && ev.type !== "geopolitics" && ev.type !== "election") return false;
  if (document.getElementById("onlyInd").checked && ev.type !== "ag") return false;
  return true;
}
function render(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById("monthLabel").textContent = y+"年"+(m+1)+"月";
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday=0
  const start = new Date(y, m, 1 - startOffset);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const today = AS_OF;
  for (let i=0;i<42;i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const key = ymd(d);
    const cell = document.createElement("div");
    cell.className = "cell" + (d.getMonth()===m ? "" : " out") + (key===today ? " today" : "");
    const head = document.createElement("div");
    head.className = "d";
    head.textContent = d.getDate();
    cell.appendChild(head);
    EVENTS.filter(ev => ev.date===key && visible(ev))
      .sort((a,b) => a.time.localeCompare(b.time))
      .forEach((ev, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip "+ev.country+(ev.tier==="B"?" B":"");
        b.textContent = ev.time+" "+ev.country_cn+" "+ev.title;
        b.title = ev.title;
        b.addEventListener("click", () => show(ev, key));
        cell.appendChild(b);
      });
    cell.addEventListener("click", (e) => {
      if (e.target === cell || e.target === head) showDay(key);
    });
    grid.appendChild(cell);
  }
}
function show(ev, key){
  const act = ev.actual || "待公布";
  document.getElementById("panel").innerHTML = `
    <h2>${ev.title}</h2>
    <div>
      <span class="badge" style="background:${({US:'#1f4e79',CN:'#c0392b',BR:'#1e8449',AR:'#6c3483',GLOBAL:'#c45c26'})[ev.country]}">${ev.country_cn}</span>
      <span class="badge" style="background:${ev.tier==='A'?'#b8860b':'#888'}">${ev.tier}级 · ${ev.type_cn}</span>
    </div>
    <div class="kv" style="margin-top:10px">
      <div><b>日期</b>${ev.date} ${ev.time}（北京）</div>
      <div><b>机构</b>${ev.agency}</div>
      <div><b>报告期</b>${ev.period || "—"}</div>
      <div><b>前值</b>${ev.previous || "—"}</div>
      <div><b>预期</b>${ev.forecast || "—"}</div>
      <div><b>实际</b>${act} ${ev.unit||""}</div>
      <div><b>来源</b>${ev.source || "—"}</div>
    </div>
    <p class="foot">同一天其它事件点格子即可切换。</p>
  `;
}
function showDay(key){
  const list = EVENTS.filter(ev => ev.date===key && visible(ev))
    .sort((a,b)=>a.time.localeCompare(b.time));
  if (!list.length) {
    document.getElementById("panel").innerHTML = `<h2>${key}</h2><p class="empty">当天无已筛选事件。</p>`;
    return;
  }
  show(list[0], key);
}
function shiftMonth(delta){
  view = new Date(view.getFullYear(), view.getMonth()+delta, 1);
  render();
}
document.getElementById("prev").onclick = () => shiftMonth(-1);
document.getElementById("next").onclick = () => shiftMonth(1);
document.getElementById("todayBtn").onclick = () => { view = new Date(AS_OF+"T00:00:00"); render(); };
document.querySelectorAll(".filters input").forEach(i => i.addEventListener("change", render));
render();
</script>
