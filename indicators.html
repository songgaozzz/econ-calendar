*,*::before,*::after{box-sizing:border-box}

.country-sub{color:var(--acc);letter-spacing:.3em;font-size:12px;font-weight:700;margin:-4px 0 6px}

.main{flex:1;min-width:0}
.grp{font-size:15px;color:var(--acc);margin:16px 0 8px}

const COLORS = ["#1e8449", "#2980b9", "#8e44ad", "#c0392b", "#d35400", "#16a085", "#7f8c8d"];
const DEFAULT_ID = "us_y10";
let _chart = null, _data = null, _id = null, _range = "all";
const RANGES = {"all": null, "1y": 365, "3m": 92, "1m": 31};
function $(s){ return document.querySelector(s); }
function fmt(v){
  if (v === null || v === undefined) return "—";
  if (Math.abs(v) >= 10000) return v.toLocaleString("en-US", {maximumFractionDigits: 0});
  if (Math.abs(v) >= 1000) return v.toLocaleString("en-US", {maximumFractionDigits: 2});
  return String(v);
}
function filtered(){
  if (!_data) return null;
  const days = RANGES[_range];
  if (!days) return _data;
  const max = _data.dates[_data.dates.length - 1];
  const cut = new Date(max + "T00:00:00"); cut.setDate(cut.getDate() - days);
  const idx = _data.dates.map((d, i) => [d, i]).filter(([d]) => new Date(d + "T00:00:00") >= cut).map(([, i]) => i);
  if (!idx.length) return _data;
  return {dates: idx.map(i => _data.dates[i]),
           series: _data.series.map(s => ({name: s.name, values: idx.map(i => s.values[i])}))};
}
function draw(){
  const d = filtered();
  const el = $("#indChart");
  if (!d || !el || typeof Chart === "undefined") return;
  if (_chart) { try { _chart.destroy(); } catch (e) {} }
  const ds = d.series.map((s, i) => ({
    label: s.name, data: s.values,
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: i === 0 ? COLORS[0] + "22" : "transparent",
    fill: i === 0, tension: 0.2, spanGaps: true, pointRadius: 2, borderWidth: 2
  }));
  _chart = new Chart(el, {
    type: "line",
    data: {labels: d.dates, datasets: ds},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: {mode: "index", intersect: false},
      plugins: {legend: {position: "bottom", labels: {boxWidth: 12, font: {size: 12}}}},
      scales: {
        x: {ticks: {maxRotation: 45, minRotation: 0, autoSkip: true, maxTicksLimit: 8, font: {size: 11}}},
        y: {title: {display: true, text: _data.unit || "", font: {size: 11}}, ticks: {font: {size: 11}}}
      }
    }
  });
  // 近 10 期表（最新在前）
  const rows = [];
  const n = d.dates.length;
  for (let k = n - 1; k >= Math.max(0, n - 10); k--) {
    rows.push("<tr><td>" + d.dates[k] + "</td>" +
      d.series.map(s => "<td>" + fmt(s.values[k]) + "</td>").join("") + "</tr>");
  }
  $("#indTable").innerHTML = "<div class=\"tw\"><table><thead><tr><th>日期</th>" +
    d.series.map(s => "<th>" + s.name + "</th>").join("") + "</tr></thead><tbody>" +
    rows.join("") + "</tbody></table></div>";
}
function select(id, btn){
  _id = id; _range = "all";
  document.querySelectorAll(".ind-btn").forEach(b => b.classList.toggle("on", b === btn));
  document.querySelectorAll(".rng").forEach(b => b.classList.toggle("on", b.dataset.r === "all"));
  const meta = MANIFEST.indicators.find(m => m.id === id);
  $("#indTitle").textContent = meta ? meta.title : id;
  $("#indInfo").textContent = "加载中…";
  $("#indTable").innerHTML = "";
  fetch(meta.file).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(doc => {
    _data = doc;
    const lat = Object.entries(doc.latest).map(([k, v]) => k + " " + fmt(v.value) + " " + doc.unit + "（" + v.date + "）").join("；");
    $("#indInfo").innerHTML = "最新：" + lat + "<br>来源：" + doc.source +
      (doc.note ? "<br>备注：" + doc.note : "") + "<br>数据截至 " + doc.updated;
    draw();
  }).catch(() => { $("#indInfo").textContent = "数据加载失败，请稍后重试或检查网络。"; });
}
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".ind-btn").forEach(b =>
    b.addEventListener("click", () => select(b.dataset.id, b)));
  document.querySelectorAll(".rng").forEach(b =>
    b.addEventListener("click", () => {
      _range = b.dataset.r;
      document.querySelectorAll(".rng").forEach(x => x.classList.toggle("on", x === b));
      draw();
    }));
  const first = document.querySelector('.ind-btn[data-id="' + DEFAULT_ID + '"]') ||
    document.querySelector(".ind-btn");
  if (first) select(first.dataset.id, first);
});
</script>
