<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/><title>指标图表</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e6e8ee;--ink:#1a1a1a;--muted:#667;--acc:#0f766e;--acc2:#0f766e;--tint:#e6f2f0}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
*,*::before,*::after{box-sizing:border-box}
.topbar{position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.14)}
header{padding:12px 16px;background:#0f766e}
.stripe{height:4px;background:linear-gradient(90deg,#0f766e 0 50%,#2dd4bf 50% 100%)}
.hwrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.emblem{display:flex;align-items:center;flex-shrink:0} .emblem svg{width:26px;height:26px;display:block} .emblem img.flag{height:26px;width:auto;display:block;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.4)} .emblem .flags{display:flex;gap:6px;align-items:center} .emblem .flags img.flag{height:22px}
h1.t{font-size:20px;margin:0;color:#fff;white-space:nowrap} .page-link{color:#fff;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:4px 10px}
.meta{color:var(--muted);font-size:12px;width:min(1100px,calc(100% - 32px));margin:0 auto;padding:10px 0 6px}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;width:min(1100px,calc(100% - 32px));margin:0 auto 24px;padding:8px 22px 20px;line-height:1.7;font-size:14.5px;}
.country-sub{color:var(--acc);letter-spacing:.3em;font-size:12px;font-weight:700;margin:-4px 0 6px}
article h1{font-size:21px} article h2{font-size:18px;margin:22px 0 10px;padding:8px 12px;border-left:4px solid var(--acc);background:var(--tint);border-bottom:1px solid var(--line);color:var(--acc)} article h3{font-size:16px}
article strong{color:var(--acc)}
article blockquote{margin:10px 0;padding:10px 14px;background:var(--tint);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;color:#334}
article blockquote p{margin:4px 0} article blockquote ul{margin:4px 0;padding-left:20px;line-height:1.65}
.note{background:#fff8e6;border:1px solid #ecd9a0;border-left:4px solid #d9a441;border-radius:8px;padding:8px 14px;margin:16px 0}
.note p{margin:6px 0} .note ul{margin:6px 0;padding-left:20px;line-height:1.65} .note strong{color:#8a6d1b}
.stats-h{width:min(1100px,calc(100% - 32px));margin:0 auto 8px;font-size:13px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;width:min(1100px,calc(100% - 32px));margin:0 auto 18px}
.stat{flex:1 1 30%;min-width:104px;max-width:220px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc2);border-radius:8px;padding:10px 12px 8px;text-decoration:none;color:inherit;cursor:pointer}
.stat:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.stat .l{font-size:12.5px;color:var(--muted)} .stat .v{font-size:20px;font-weight:700;color:var(--acc);margin:3px 0 1px} .stat .d{font-size:11px;color:var(--muted)}
article a{color:var(--acc)} article img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff;display:block} .tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:13px;line-height:1.5;min-width:600px}
th,td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;text-align:left} th{background:#d9e1f2} tr:nth-child(even) td{background:#fafbfd}
code{background:#f0f2f5;padding:1px 4px;border-radius:4px}
h2.sec{font-size:17px;width:min(1100px,calc(100% - 32px));margin:0 auto 10px;color:var(--acc)}
.issue{background:var(--card);border:1px solid var(--line);border-radius:10px;width:min(1100px,calc(100% - 32px));margin:0 auto 12px;padding:10px 18px 12px}
.issue h3{margin:0 0 4px;font-size:15.5px} .issue h3 .d{color:var(--acc)}
.issue ul{margin:4px 0 0;padding-left:20px;line-height:1.65;font-size:14px} .issue li{margin-bottom:2px}
.archive{width:min(1100px,calc(100% - 32px));margin:0 auto 24px;color:var(--muted);font-size:12.5px;line-height:1.8}
.cards{display:flex;flex-direction:column;gap:12px;width:min(1100px,calc(100% - 32px));margin:0 auto 24px}
.digest{width:min(1100px,calc(100% - 32px));margin:0 auto 24px}
.digest-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;margin-bottom:12px}
.digest-item h3{margin:0 0 6px;font-size:16px} .digest-item h3 a{text-decoration:none} .digest-item h3 .d{color:var(--muted);font-size:12.5px;font-weight:400}
.digest-item ul{margin:4px 0 0;padding-left:20px;line-height:1.65;font-size:14px} .digest-item li{margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.card h3{margin:0 0 6px;font-size:17px} .card h3 a{color:var(--acc);text-decoration:none}
.card p{margin:4px 0;line-height:1.65;font-size:14px} .card .d{color:var(--muted);font-size:12.5px}
.foot{color:var(--muted);font-size:12px;width:min(1100px,calc(100% - 32px));margin:0 auto;padding:0 0 24px}
@media (max-width:640px){article{padding:4px 12px 14px;font-size:14px} .issue{padding:8px 12px 10px} table{font-size:12px} .page-link{padding:6px 12px;font-size:14px;white-space:nowrap} header{padding:8px 10px} .hwrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} .hwrap::-webkit-scrollbar{display:none}}

/* 两栏布局（2026-11-24 Lau：图和表在右，指标选项在左，左栏独立滚动） */
.layout{display:flex;gap:16px;width:min(1100px,calc(100% - 32px));margin:0 auto 24px;align-items:flex-start}
.sidebar{width:320px;flex-shrink:0;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:12px;border-right:1px solid #d8dce4;scrollbar-width:thin}
.main{flex:1;min-width:0}

.grp .ind-btn .v{color:var(--gc)}
.grp .ind-btn.on{border-color:var(--gc);box-shadow:0 0 0 1px var(--gc)}
.main[data-group="us"]{--gc:#1b3a5f} .main[data-group="br"]{--gc:#0a5c36} .main[data-group="ar"]{--gc:#1f6fb8}
.main[data-group] .sec{color:var(--gc)}
.main[data-group] #indDaily a{color:var(--gc)}
.main[data-group] .rng.on{color:var(--gc);border-color:var(--gc)}
.grp{margin:16px 0 8px}
.grp summary{list-style:none;cursor:pointer;font-size:15px;font-weight:700;color:var(--gc);display:flex;align-items:center;gap:6px;padding:2px 0}
.grp summary::-webkit-details-marker{display:none}
.grp summary .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.grp summary::after{content:"▾";color:var(--muted);font-size:12px}
.grp:not([open]) summary::after{content:"▸"}
.sidebar .grp:first-child{margin-top:0}
.sidebar .ind-list{margin:0 0 8px;max-width:none}
.main .chart-wrap,.main .chart-cap,.main .rngs{margin-left:0;margin-right:0}
.main .chart-wrap{margin-top:0}
.main .sec{width:100%;margin:14px 0 10px}
.main #indTable{margin:10px 0 24px}
.ind-btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 8px;cursor:pointer;font-family:inherit}
.ind-btn .t{font-size:15px;font-weight:700;color:var(--ink)}
.ind-btn .v{font-size:13px;color:var(--acc);margin-top:2px}
.ind-btn .v small{color:var(--muted)}
.ind-btn.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.chart-wrap{margin:12px 16px 0;height:240px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.chart-cap{font-size:12px;color:var(--muted);margin:8px 16px 0;line-height:1.7}
#indDaily a{color:var(--acc);font-weight:700;text-decoration:none}
.rngs{margin:10px 16px 0;display:flex;gap:8px;flex-wrap:wrap}
.rng{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.rng.on{border-color:var(--acc);color:var(--acc);font-weight:700}
#indTable{margin:10px 16px 24px}
#indTable table{min-width:0;width:100%}
.ind-list{margin:0 16px 8px;max-width:1100px}
@media (max-width:768px){.layout{flex-direction:column} .main{order:1} .sidebar{order:2;width:100%;position:static;max-height:none;overflow:visible;padding-right:0;border-right:none}}
@media (max-width:640px){.chart-wrap{margin-left:6px;margin-right:6px;height:220px} .rngs,.chart-cap,#indTable{margin-left:6px;margin-right:6px} .ind-list{margin-left:6px;margin-right:6px}}

const COLORS = ["#1e8449", "#2980b9", "#8e44ad", "#c0392b", "#d35400", "#16a085", "#7f8c8d"];
const DEFAULT_ID = "us_y10";
const GNAME = {us: "美国", br: "巴西", ar: "阿根廷"};
let _chart = null, _data = null, _id = null, _range = "all";
const RANGES = {"all": null, "1y": 365, "3m": 92, "1m": 31};
function $(s){ return document.querySelector(s); }
function fmt(v){
  if (v === null || v === undefined) return "—";
  if (Math.abs(v) >= 10000) return v.toLocaleString("en-US", {maximumFractionDigits: 0});
  if (Math.abs(v) >= 1000) return v.toLocaleString("en-US", {maximumFractionDigits: 2});
  return String(v);
}
function filtered(){
  if (!_data) return null;
  const days = RANGES[_range];
  if (!days) return _data;
  const max = _data.dates[_data.dates.length - 1];
  const cut = new Date(max + "T00:00:00"); cut.setDate(cut.getDate() - days);
  const idx = _data.dates.map((d, i) => [d, i]).filter(([d]) => new Date(d + "T00:00:00") >= cut).map(([, i]) => i);
  if (!idx.length) return _data;
  return {dates: idx.map(i => _data.dates[i]),
           series: _data.series.map(s => ({name: s.name, values: idx.map(i => s.values[i])}))};
}
function draw(){
  const d = filtered();
  const el = $("#indChart");
  if (!d || !el || typeof Chart === "undefined") return;
  if (_chart) { try { _chart.destroy(); } catch (e) {} }
  const ds = d.series.map((s, i) => ({
    label: s.name, data: s.values,
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: i === 0 ? COLORS[0] + "22" : "transparent",
    fill: i === 0, tension: 0.2, spanGaps: true, pointRadius: 2, borderWidth: 2
  }));
  _chart = new Chart(el, {
    type: "line",
    data: {labels: d.dates, datasets: ds},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: {mode: "index", intersect: false},
      plugins: {legend: {position: "bottom", labels: {boxWidth: 12, font: {size: 12}}}},
      scales: {
        x: {ticks: {maxRotation: 45, minRotation: 0, autoSkip: true, maxTicksLimit: 8, font: {size: 11}}},
        y: {title: {display: true, text: _data.unit || "", font: {size: 11}}, ticks: {font: {size: 11}}}
      }
    }
  });
  // 近 10 期表（最新在前）
  const rows = [];
  const n = d.dates.length;
  for (let k = n - 1; k >= Math.max(0, n - 10); k--) {
    rows.push("<tr><td>" + d.dates[k] + "</td>" +
      d.series.map(s => "<td>" + fmt(s.values[k]) + "</td>").join("") + "</tr>");
  }
  $("#indTable").innerHTML = "<div class=\"tw\"><table><thead><tr><th>日期</th>" +
    d.series.map(s => "<th>" + s.name + "</th>").join("") + "</tr></thead><tbody>" +
    rows.join("") + "</tbody></table></div>";
}
function select(id, btn){
  _id = id; _range = "all";
  document.querySelectorAll(".ind-btn").forEach(b => b.classList.toggle("on", b === btn));
  document.querySelectorAll(".rng").forEach(b => b.classList.toggle("on", b.dataset.r === "all"));
  const meta = MANIFEST.indicators.find(m => m.id === id);
  $("#indTitle").textContent = meta ? meta.title : id;
  $("#indInfo").textContent = "加载中…";
  $("#indTable").innerHTML = "";
  // 回链日报 + 地址栏同步指标（日报页数字条点过来用 #id 定位）
  if (meta) {
    $("#indDaily").innerHTML = '<a href="daily-' + meta.group + '.html">查看最新' + (GNAME[meta.group] || "") + '日报 ›</a>';
    document.querySelector(".main").dataset.group = meta.group;
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    if (btn && window.innerWidth > 768 && btn.scrollIntoView) btn.scrollIntoView({block: "nearest"});
  }
  fetch(meta.file).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(doc => {
    _data = doc;
    const lat = Object.entries(doc.latest).map(([k, v]) => k + " " + fmt(v.value) + " " + doc.unit + "（" + v.date + "）").join("；");
    $("#indInfo").innerHTML = "最新：" + lat + "<br>来源：" + doc.source +
      (doc.note ? "<br>备注：" + doc.note : "") + "<br>数据截至 " + doc.updated;
    draw();
  }).catch(() => { $("#indInfo").textContent = "数据加载失败，请稍后重试或检查网络。"; });
}
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".ind-btn").forEach(b =>
    b.addEventListener("click", () => select(b.dataset.id, b)));
  document.querySelectorAll(".rng").forEach(b =>
    b.addEventListener("click", () => {
      _range = b.dataset.r;
      document.querySelectorAll(".rng").forEach(x => x.classList.toggle("on", x === b));
      draw();
    }));
  const hashId = (location.hash || "").slice(1);
  const initial = MANIFEST.indicators.some(m => m.id === hashId) ? hashId : DEFAULT_ID;
  const first = document.querySelector('.ind-btn[data-id="' + initial + '"]') ||
    document.querySelector(".ind-btn");
  if (first) select(first.dataset.id, first);
});
</script>
